name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  HYPERFRAMES_NO_TELEMETRY: "1"
  HYPERFRAMES_NO_UPDATE_CHECK: "1"

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows since roadmap step 4: the argv of what HyperFrames starts is recorded by a Node preload
        # (lib/argv-recorder.cjs, docs/design-decisions.md D10), not by POSIX sh shims.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      # ffmpeg-skill's probe.py runs on Python; on Windows `python3` may be a Store alias, so the
      # interpreter is named explicitly (HYPERFRAMES_SKILL_PYTHON, lib/ffmpeg-skill.mjs)
      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with:
          python-version: "3.12"
      - name: Point the ffmpeg-skill cross-check at that Python (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "HYPERFRAMES_SKILL_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
      - run: npm ci
      # ffmpeg-skill is optional at run time; CI pins a release so render's cross-check
      # (ffmpeg_skill.status, docs/design-decisions.md D3) runs for real. Read-only use.
      - name: Check out ffmpeg-skill (pinned) for the cross-check
        shell: bash
        env:
          FFMPEG_SKILL_TAG: v2.23.1
        run: |
          set -eu
          git clone --quiet --depth 1 --branch "$FFMPEG_SKILL_TAG" https://github.com/kajisho5/ffmpeg-skill "$RUNNER_TEMP/ffmpeg-skill"
          "${HYPERFRAMES_SKILL_PYTHON:-python3}" --version
          echo "HYPERFRAMES_SKILL_FFMPEG_SKILL_DIR=$RUNNER_TEMP/ffmpeg-skill" >> "$GITHUB_ENV"
      - name: Install HyperFrames' chrome-headless-shell
        run: npx hyperframes browser ensure
      - name: doctor (must be ok before anything claims it can run)
        run: node scripts/doctor.mjs
      - name: Tests, including real Chrome + ffmpeg renders
        run: npm test
      - name: Demos (every tool end to end)
        run: npm run demo
      - name: Render with no network (loopback only)
        if: runner.os == 'Linux'
        run: |
          set -eu
          out="$RUNNER_TEMP/offline"
          node scripts/scene.mjs tests/fixtures/two-line.json -o "$out/scene" --json > /dev/null
          chrome="$(npx hyperframes browser path)"
          node scripts/render.mjs "$out/scene" -o "$out/online.mp4" --json > /dev/null
          sudo unshare -n sh -c "ip link set lo up && HOME='$HOME' PATH='$PATH' HYPERFRAMES_BROWSER_PATH='$chrome' node scripts/render.mjs '$out/scene' -o '$out/offline.mp4' --json" > "$out/offline.json"
          node -e "const d=require('$out/offline.json'); if (d.status !== 'completed' || d.verified !== true) { console.error(d); process.exit(1) }"
          a="$(sha256sum "$out/online.mp4" | cut -d' ' -f1)"; b="$(sudo sha256sum "$out/offline.mp4" | cut -d' ' -f1)"
          echo "online $a"; echo "offline $b"
          test "$a" = "$b"
